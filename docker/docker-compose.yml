---
services:
  www:
    build:
      context: ..
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://db:5432/sonar"
    ports:
      - mode: ingress
        target: 9000
        published: 9001
    volumes:
      - type: "volume"
        source: "plugins"
        target: "/opt/sonarqube/extensions/plugins"
    depends_on:
      - db

  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: "sonar"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - "dbdata:/var/lib/postgresql/data:rw"

volumes:
  dbdata:
  plugins:
