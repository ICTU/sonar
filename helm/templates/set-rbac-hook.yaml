{{- if .Values.rbac.enabled -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rbac-hook
  labels:
    app: sonarqube
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install, post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "2"
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-rbac-hook
      labels:
        app: sonarqube
        chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        release: {{ .Release.Name }}
        heritage: {{ .Release.Service }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: {{ .Release.Name }}-rbac-job
          image: alpine/curl:8.21.0@sha256:a1c44bab54d88e18ea9a6a4ecefab7f2d230b968567b78960fcaff8d51b7f067
          command: ["sh", "-c", "/configure-rbac.sh"]
          env:
            - name: SONARQUBE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sonarAdminCredential }}
                  key: password
          volumeMounts:
            - name: configure-rbac-volume
              mountPath: /configure-rbac.sh
              subPath: configure-rbac.sh
      volumes:
        - name: configure-rbac-volume
          configMap:
            defaultMode: 0755
            name: {{ .Release.Name }}-rbac-script
{{- end -}}
